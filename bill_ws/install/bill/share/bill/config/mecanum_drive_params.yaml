mecanum_drive_controller:
  type: "mecanum_drive_controller/MecanumDriveController"
  front_left_wheel: "front_left_wheel_joint"
  front_right_wheel: "front_right_wheel_joint"
  rear_left_wheel: "rear_left_wheel_joint"
  rear_right_wheel: "rear_right_wheel_joint"
  wheel_separation_x: 0.4  # Distância entre as rodas frontais e traseiras
  wheel_separation_y: 0.4  # Distância entre as rodas direita e esquerda
  wheel_radius: 0.07
  publish_rate: 50
  command_timeout: 0.5
  odom_frame: "odometry"
