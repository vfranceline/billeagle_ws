controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController
      ros__parameters:
        # --- nomes obrigatórios de juntas de comando ---
        front_left_wheel_command_joint_name:  "wheel_front_left_joint"
        front_right_wheel_command_joint_name: "wheel_front_right_joint"
        rear_left_wheel_command_joint_name:   "wheel_rear_left_joint"
        rear_right_wheel_command_joint_name:  "wheel_rear_right_joint"

        # --- parâmetros de cinemática (exemplo de teste) ---
        kinematics:
          wheels_radius:                       0.07
          sum_of_robot_center_projection_on_X_Y_axis: 1.0

        # --- odometria e frames ---
        base_frame_id:     "base_link"
        odom_frame_id:     "odom"
        enable_odom_tf:    true

        # --- timeout e taxas ---
        reference_timeout: 0.9
        publish_rate:      50.0
