sync_slam_toolbox_node:
  ros__parameters:
    # --- Configurações gerais ---
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: false  # True se estiver rodando em simulação

    # --- Configurações do mapa ---
    resolution: 0.05  # Tamanho do pixel do mapa em metros
    max_laser_range: 10.0  # Alcance máximo do LIDAR a ser considerado
    minimum_time_interval: 0.5  # Tempo mínimo entre as atualizações do mapa (segundos)
    
    # --- Configuração de otimização do SLAM ---
    optimization_period: 0.1  # Tempo entre otimizações do mapa
    loop_search_time: 10.0  # Tempo de busca por fechamento de loop

    # --- Filtros e ajustes do laser ---
    transform_publish_period: 0.05  # Tempo de publicação da TF (em segundos)
    map_update_interval: 2.0  # Tempo entre atualizações do mapa (segundos)
    
    # --- Configuração do algoritmo de correspondência ---
    minimum_travel_distance: 0.2  # Distância mínima para atualizar a posição do robô
    minimum_travel_heading: 0.1  # Mudança mínima na orientação para atualização

    # --- Parâmetros para fechamento de loop ---
    loop_closure: true  # Ativa ou desativa fechamento de loop
    loop_closure_search_radius: 5.0  # Raio de busca para fechamento de loop
    loop_closure_min_chain_size: 10  # Mínimo de poses para considerar um fechamento de loop
    loop_closure_max_edge_length: 3.0  # Distância máxima entre dois pontos no loop
    
    # --- Arquivo do mapa salvo ---
    map_file_name: "my_slam_map"
    mode: "mapping"  # Pode ser "mapping" (criar mapa) ou "localization" (usar mapa salvo)

    # --- Outros parâmetros úteis ---
    enable_interactive_mode: false
    use_scan_matching: true
    use_loop_closing: true
